name: build-pydantic-core

# Phase 0B.1/0B.2/0B.3：固定版本四 ABI 构建 + tag/ELF 校验 + PEP 503 索引发布
# 闸门判据见 docs/gate.md；失败 = BtDeck 服务端模式暂停，伴侣模式先行。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.pkg }}-${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Chaquopy 15.0.1 起 Python 3.12+ 不支持 32 位 ABI（armeabi-v7a/x86，
        # 官方 changelog + 仓库 cp312 wheel 实测均只有 64 位），矩阵收敛为两 ABI
        include:
          - { pkg: pydantic-core, abi: arm64-v8a,  target: aarch64-linux-android }
          - { pkg: pydantic-core, abi: x86_64,     target: x86_64-linux-android }
          # bcrypt：官方仓库存量 3.2.2 在 Android15 16K 镜像 dlopen 失败，自建 5.0.0
          - { pkg: bcrypt,        abi: arm64-v8a,  target: aarch64-linux-android }
          - { pkg: bcrypt,        abi: x86_64,     target: x86_64-linux-android }
          # setuptools 系 C/C++ 扩展：官方仓库存量 wheel 同因 16K 不可载，自建对齐后端 pin
          - { pkg: greenlet,      abi: arm64-v8a,  target: aarch64-linux-android }
          - { pkg: greenlet,      abi: x86_64,     target: x86_64-linux-android }
          - { pkg: regex,         abi: arm64-v8a,  target: aarch64-linux-android }
          - { pkg: regex,         abi: x86_64,     target: x86_64-linux-android }
          - { pkg: pycryptodomex, abi: arm64-v8a,  target: aarch64-linux-android }
          - { pkg: pycryptodomex, abi: x86_64,     target: x86_64-linux-android }
          # pillow：官方 wheel 链私有 libjpeg_chaquopy.so 在 16K 镜像找不到——自建（zlib 走 NDK sysroot，无 jpeg 头自动禁用 JPEG）
          - { pkg: pillow,        abi: arm64-v8a,  target: aarch64-linux-android }
          - { pkg: pillow,        abi: x86_64,     target: x86_64-linux-android }
    steps:
      - uses: actions/checkout@v4

      - name: 固定工具链版本（versions.env 单一来源）
        run: cat versions.env && grep -q '^PYDANTIC_CORE_VERSION=' versions.env

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ matrix.pkg == 'pydantic-core' || matrix.pkg == 'bcrypt' }}
        with:
          targets: ${{ matrix.target }}

      - name: 安装 NDK（版本锁定 versions.env）
        run: |
          source versions.env
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${ANDROID_NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: 安装构建工具（版本锁定）
        run: |
          source versions.env
          pip install "maturin==1.8.2" packaging patchelf
          if [[ "${{ matrix.pkg }}" == "pydantic-core" || "${{ matrix.pkg }}" == "bcrypt" ]]; then
            # cargo-ndk 只发布在 crates.io（PyPI 无此包，首建 run 33163185434 实证），经 cargo 安装；
            # patchelf 用于给扩展 .so 补 DT_NEEDED libpython3.12.so（lld --as-needed 会丢弃空 stub 的 NEEDED）
            cargo install cargo-ndk --locked --version "${CARGO_NDK_VERSION}"
          fi

      - name: 构建 wheel
        run: |
          case "${{ matrix.pkg }}" in
            pydantic-core|bcrypt)
              bash "scripts/build-${{ matrix.pkg }}.sh" "${{ matrix.target }}" "${{ matrix.abi }}" ;;
            *)
              bash scripts/build-ndk-cext.sh "${{ matrix.pkg }}" "${{ matrix.target }}" "${{ matrix.abi }}" ;;
          esac

      - name: 记录 sdist hash（首次运行后回填 versions.env）
        run: sha256sum pydantic_core-*.tar.gz || true

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.pkg }}-${{ matrix.abi }}
          path: dist/${{ matrix.abi }}/*.whl
          if-no-files-found: error

  index:
    name: PEP 503 index
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 推 gh-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # extra-wheels/：纯 Python sdist-only 依赖的预构建 wheel（见目录内 README）
      - run: cp extra-wheels/*.whl dist/

      - run: python scripts/make-simple-index.py dist public

      - name: 生成 SBOM 与构建元数据
        run: |
          mkdir -p public
          {
            echo "# build metadata"
            echo "date: $(date -u +%FT%TZ)"
            echo "commit: $GITHUB_SHA"
            cat versions.env
          } > public/BUILD-INFO.txt
          pip install cyclonedx-bom && cyclonedx-bom || true

      - uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: false

  gate-summary:
    name: 闸门结论
    needs: [build, index]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 汇总（结论追加登记到 docs/gate.md 由人工/后续 job 完成）
        run: |
          echo "build=${{ needs.build.result }} index=${{ needs.index.result }}"
          if [[ "${{ needs.build.result }}" != "success" || "${{ needs.index.result }}" != "success" ]]; then
            echo "::error::Phase 0B 构建闸门未通过——BtDeck 服务端模式暂停，伴侣模式先行"
            exit 1
          fi
