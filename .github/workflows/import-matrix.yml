name: import-matrix

# Phase 0B.4/0B.5：Chaquopy 模拟器/真机导入矩阵
# 阶段 1（默认）：最小 FastAPI + pydantic hello world
# 阶段 2（full-graph=true 或手动触发）：BtDeck 完整 import graph +
#   /health/live + 一次 Alembic 迁移 + 前端静态资源加载 + 16KB page-size
#
# 矩阵说明（2026-08-28 首建修正）：
# - GitHub ubuntu runner 上仅有 x86_64 模拟器镜像可用（arm64-v8a/armeabi-v7a
#   无 x86_64 宿主镜像，且 API 34/35 无 ARM 系统镜像）；CI 覆盖 x86_64 × API 34/35，
#   arm64-v8a 导入验证由真实设备执行（gate.md 登记，对应闸门判据 4/5 的设备侧证据）。
# - android-emulator-runner 在 step 结束时会关闭模拟器，因此
#   connectedDebugAndroidTest 必须在其 script 块内执行，不能作为后续独立 step。
# - 索引地址经 -Pbtdeck.wheels.index 注入（testapp/build.gradle.kts 读取的
#   gradle 属性；写入 local.properties 的 chaquopy.extraIndexUrl 无人消费，已移除）。
on:
  workflow_dispatch:
    inputs:
      full-graph:
        description: "跑 BtDeck 完整 import graph（需主仓 dist 资源）"
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * 1" # 每周一复核（防止上游/NDK 漂移）

permissions:
  contents: read

jobs:
  chaquopy-import:
    name: import ${{ matrix.abi }} (api ${{ matrix.api }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [x86_64] # arm64-v8a 真机验证；armeabi-v7a/x86 无 API 34/35 模拟器镜像
        api: [34, 35] # 代表设备；16KB page-size 校验依赖 API 35 模拟器镜像
    env:
      WHEELS_INDEX: https://${{ github.repository_owner }}.github.io/android-wheels/simple/
    steps:
      - uses: actions/checkout@v4

      # 仓库不带 gradlew wrapper（wrapper 二进制不入库），由 runner 侧安装 Gradle
      - name: 安装 Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 诊断：下载本仓 wheel 并模拟 Chaquopy RECORD 解析
        run: |
          python3 - <<'EOF'
          import csv, io, urllib.request, zipfile
          url = "https://strainhzj.github.io/android-wheels/simple/pydantic-core/pydantic_core-2.41.5-cp312-cp312-android_24_x86_64.whl"
          data = urllib.request.urlopen(url).read()
          print("wheel bytes:", len(data))
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              print("so files:", [n for n in z.namelist() if n.endswith(".so")])
              text = z.read("pydantic_core-2.41.5.dist-info/RECORD").decode()
          print("RECORD rows（Chaquopy 17.0.0 逐行视角）:")
          for i, row in enumerate(csv.reader(io.StringIO(text))):
              row += [None] * (len(row) - 3)
              try:
                  path, hash_str, size_str = row
              except ValueError:
                  print(f"  row{i} UNPACK-FAIL {row}"); continue
              flag = "  <-- int('') 会崩" if (size_str == "" ) else ""
              print(f"  row{i} path={path!r} hash={bool(hash_str)} size={size_str!r}{flag}")
          EOF

      - name: Gradle 构建 testapp（Chaquopy + 本仓索引，构建期即验证 wheel 解析）
        run: gradle :app:assembleDebug -p testapp "-Pbtdeck.wheels.index=$WHEELS_INDEX"

      - name: 启动模拟器并运行导入测试
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          # API 35 default 镜像在软件模拟下 droid.bluetooth SIGABRT 系统级崩溃
          # （run 33174886690 原跑+重跑两连崩、应用零痕迹），改用 CI 专用 ATD 镜像
          target: ${{ matrix.api == 35 && 'google_atd' || 'default' }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # GitHub ubuntu runner 无 KVM（emulator 以 -accel off 纯软件模拟启动），
          # 冷启动实测约 10-11 分钟，默认 600s 会超时（run 33166558591 实证）
          emulator-boot-timeout: 1800
          # 软件模拟下 CPU 过慢触发蓝牙栈看门狗 SIGABRT（ATD 镜像同样复现，
          # run 33177679622），启动前直接关闭蓝牙硬件仿真
          pre-emulator-launch-script: |
            sed -i 's/hw.bluetooth *= *yes/hw.bluetooth = no/' \
              "$HOME/.android/avd/test.avd/config.ini" || true
            echo 'hw.bluetooth = no' >> "$HOME/.android/avd/test.avd/config.ini"
          script: bash scripts/emu-import-test.sh "$WHEELS_INDEX"

      - name: 完整 import graph（可选阶段 2）
        if: ${{ github.event.inputs.full-graph == 'true' }}
        run: |
          echo "TODO(phase-0B.4): 拉取 BtDeck backend frontend_dist + alembic 资源注入 testapp"
          echo "TODO: 验证 /health/live、一次迁移、静态资源、冷启动、升级安装、wheel 缺失失败信息"
          exit 1 # 阶段 2 脚手架就绪即失败——直到真实资源接入
